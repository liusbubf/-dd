# nginx 反向代理 —— 前端静态资源 + /api、/api/ws 反代到后端
# 被 frontend/Dockerfile 拷贝到 /etc/nginx/conf.d/default.conf
# 端口约定：前端 nginx 80（宿主映射 5173）；后端 backend:8000
# ---------------------------------------------------------------------------

# WebSocket 升级所需：根据 Upgrade 头动态设置 Connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cloud_backend {
    # compose 网络内的服务名 backend，端口 8000
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # --- API 反代（覆盖 /api 与 /api/ws；WS 也匹配此前缀）---
    # 单个 location 同时携带 Upgrade 头，HTTP 与 WebSocket 皆可工作。
    location /api/ {
        proxy_pass http://cloud_backend;
        proxy_http_version 1.1;

        # WebSocket 升级（/api/ws）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 常规透传头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WS 长连接：拉长读超时，禁用缓冲，保证预览帧实时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- 前端单页应用（SPA）路由回退 ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
